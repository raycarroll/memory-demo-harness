# Agent backend definitions
agents:
  openai-chat:
    type: direct
    provider: openai
    model: gpt-4o
    system_prompt: "You are a helpful assistant."

  claude-sonnet:
    type: direct
    provider: anthropic
    model: claude-sonnet-4-20250514
    system_prompt: "You are a helpful coding assistant."

# Memory backend definitions
memory:
  none:
    type: none

  dict:
    type: dict

  text-file:
    type: file
    path: ./memory/facts.txt

# User personas for pre-populated demos
personas:
  none:
    name: "None (Empty)"
    description: "Start with no pre-populated memories"
    seed_file: null

  data-scientist:
    name: "Alex Chen - Data Scientist"
    description: "Senior Data Scientist working on ML Ops, prefers Python"
    seed_file: ./seeds/data-scientist.txt

  sre-oncall:
    name: "Jordan Lee - SRE"
    description: "On-call Site Reliability Engineer, command-line focused"
    seed_file: ./seeds/oncall-engineer.txt

  developer:
    name: "Sam Rodriguez - Full-stack Developer"
    description: "Full-stack developer using Python/TypeScript"
    seed_file: ./seeds/developer.txt

  executive:
    name: "Alex Morgan - VP of Operations"
    description: "C-level executive managing operations, digital transformation, team leadership"
    seed_file: ./seeds/executive.txt

# Available tools for simulated mode
tools:
  infrastructure:
    - name: kubectl
      description: "Kubernetes CLI - get/describe/logs/set resources"
      enabled: true
    - name: oc
      description: "OpenShift CLI - deploy/rollout/project management"
      enabled: true

  filesystem:
    - name: file_read
      description: "Read file contents"
      enabled: true
    - name: file_write
      description: "Write/create files"
      enabled: true
    - name: bash
      description: "Execute bash commands"
      enabled: true

  research:
    - name: web_search
      description: "Search the web for information"
      enabled: true

  api:
    - name: http_request
      description: "Make HTTP API calls"
      enabled: true

  data:
    - name: database_query
      description: "Execute SQL queries"
      enabled: true
    - name: data_query
      description: "Query data sources"
      enabled: true

  visualization:
    - name: chart_generate
      description: "Generate charts and visualizations"
      enabled: true

  utilities:
    - name: calendar_read
      description: "Read calendar/schedule"
      enabled: true
